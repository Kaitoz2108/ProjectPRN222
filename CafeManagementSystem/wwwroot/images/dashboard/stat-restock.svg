<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="sackGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D7B58A"/>
      <stop offset="60%" stop-color="#BA9263"/>
      <stop offset="100%" stop-color="#8F6B41"/>
    </linearGradient>
    <linearGradient id="beanGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#543118"/>
      <stop offset="100%" stop-color="#341C0C"/>
    </linearGradient>
    <filter id="sackShadow">
      <feDropShadow dx="0" dy="7" stdDeviation="6" flood-color="#302A25" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Shadow under sack -->
  <ellipse cx="102" cy="172" rx="60" ry="16" fill="#302A25" opacity="0.14" filter="url(#sackShadow)"/>

  <!-- Sack Body -->
  <path d="M60 110 C50 145 60 170 102 170 C144 170 154 145 144 110 C140 95 136 84 130 84 C115 86 110 82 102 82 C94 82 89 86 74 84 C68 84 64 95 60 110 Z" fill="url(#sackGrad)" filter="url(#sackShadow)"/>

  <!-- Sack texture lines -->
  <path d="M72 105 Q102 110 132 105" stroke="#7A562B" stroke-width="1.5" stroke-dasharray="3 3" fill="none" opacity="0.4"/>
  <path d="M68 128 Q102 134 136 128" stroke="#7A562B" stroke-width="1.5" stroke-dasharray="3 3" fill="none" opacity="0.4"/>
  <path d="M72 148 Q102 154 132 148" stroke="#7A562B" stroke-width="1.5" stroke-dasharray="3 3" fill="none" opacity="0.4"/>

  <!-- Sack Rolled / Open Top -->
  <ellipse cx="102" cy="80" rx="34" ry="18" fill="#755026"/>
  <ellipse cx="102" cy="80" rx="31" ry="15" fill="#3B220F"/>

  <!-- Mound of coffee beans inside top -->
  <ellipse cx="94" cy="76" rx="9" ry="6" fill="url(#beanGrad)" transform="rotate(-15 94 76)"/>
  <ellipse cx="110" cy="77" rx="8" ry="5.5" fill="url(#beanGrad)" transform="rotate(25 110 77)"/>
  <ellipse cx="102" cy="73" rx="8.5" ry="6" fill="#4B2A15" transform="rotate(5 102 73)"/>
  <ellipse cx="86" cy="82" rx="7.5" ry="5" fill="url(#beanGrad)" transform="rotate(35 86 82)"/>
  <ellipse cx="118" cy="82" rx="8" ry="5" fill="url(#beanGrad)" transform="rotate(-20 118 82)"/>
  <ellipse cx="102" cy="84" rx="9" ry="6" fill="#422512"/>

  <!-- Roasted beans spilling at bottom -->
  <ellipse cx="56" cy="168" rx="7.5" ry="5" fill="url(#beanGrad)" transform="rotate(-30 56 168)"/>
  <ellipse cx="68" cy="172" rx="6.5" ry="4.5" fill="url(#beanGrad)" transform="rotate(15 68 172)"/>
  <ellipse cx="48" cy="174" rx="6" ry="4" fill="url(#beanGrad)" transform="rotate(40 48 174)"/>
  <ellipse cx="148" cy="166" rx="7" ry="5" fill="url(#beanGrad)" transform="rotate(20 148 166)"/>
  <ellipse cx="158" cy="171" rx="6" ry="4" fill="url(#beanGrad)" transform="rotate(-35 158 171)"/>
  <ellipse cx="138" cy="172" rx="6.5" ry="4.5" fill="url(#beanGrad)" transform="rotate(10 138 172)"/>
</svg>

